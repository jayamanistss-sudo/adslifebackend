name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: adslife_ci
          POSTGRES_PASSWORD: adslife_ci
          POSTGRES_DB: adslife_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: adslife_ci
      DB_USER: adslife_ci
      DB_PASS: adslife_ci
      JWT_SECRET: ci_test_secret_not_for_production
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Load CI schema fixture
        run: |
          PGPASSWORD=adslife_ci psql -h localhost -U adslife_ci -d adslife_ci -f test/fixtures/ci-schema.sql
          PGPASSWORD=adslife_ci psql -h localhost -U adslife_ci -d adslife_ci -f test/fixtures/ci-seed.sql

      - name: Unit tests
        run: npm test -- --ci

      - name: E2E tests
        run: npm run test:e2e -- --ci

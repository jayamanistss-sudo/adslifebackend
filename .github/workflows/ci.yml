name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: `npm run lint` is not wired up in this repo yet — eslint isn't
      # a dependency and no config file exists, so it fails on every commit,
      # not just this one. Left out of the gate until that's set up.

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci
